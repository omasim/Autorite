name: Validate research source and sites
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-sites.txt
      - run: python -m pip install numpy==2.0.2
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/check-baseline.py
      - run: python packages/research-schema/validate.py
      - run: python scripts/check-pilots.py
      - run: python scripts/rp002a-design-review.py --check
      - run: python -m unittest discover -s tests
      - run: python scripts/build-sites.py
      - run: python scripts/check-sites.py
